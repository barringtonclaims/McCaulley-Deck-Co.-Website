<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Outer badge shape - white -->
  <rect x="80" y="40" width="640" height="320" rx="20" ry="20" fill="white"/>
  
  <!-- Inner border line -->
  <rect x="92" y="52" width="616" height="296" rx="14" ry="14" fill="none" stroke="white" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Inner fill - transparent with white border -->
  <rect x="100" y="60" width="600" height="280" rx="12" ry="12" fill="none" stroke="white" stroke-width="0"/>
  
  <!-- Cut out the inside to make the badge a frame -->
  <!-- Actually, for white on transparent, we want just the outline badge + text -->
  
  <!-- Outer badge outline only -->
  <rect x="80" y="40" width="640" height="320" rx="20" ry="20" fill="none" stroke="white" stroke-width="6"/>
  
  <!-- Inner border line -->
  <rect x="92" y="52" width="616" height="296" rx="14" ry="14" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- McCaulley text -->
  <text x="400" y="195" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-weight="600" font-size="98" fill="white" letter-spacing="1">McCaulley</text>
  
  <!-- DECK CO. text -->
  <text x="400" y="275" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-weight="500" font-size="72" fill="white" letter-spacing="12">DECK CO.</text>
</svg>
