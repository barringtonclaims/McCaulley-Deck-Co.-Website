<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Outer badge outline only - navy -->
  <rect x="80" y="40" width="640" height="320" rx="20" ry="20" fill="none" stroke="#1B2A4A" stroke-width="6"/>
  
  <!-- Inner border line - navy -->
  <rect x="92" y="52" width="616" height="296" rx="14" ry="14" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  
  <!-- McCaulley text -->
  <text x="400" y="195" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-weight="600" font-size="98" fill="#1B2A4A" letter-spacing="1">McCaulley</text>
  
  <!-- DECK CO. text -->
  <text x="400" y="275" text-anchor="middle" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-weight="500" font-size="72" fill="#1B2A4A" letter-spacing="12">DECK CO.</text>
</svg>
